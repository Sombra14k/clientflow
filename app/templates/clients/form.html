{% extends "base.html" %}
{% block title %}{{ 'Editar cliente' if editing else 'Novo cliente' }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>{{ 'Editar cliente' if editing else 'Novo cliente' }}</h1></div></header>
<form method="post" class="panel form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="fields">
    <label>Nome *<input name="name" required value="{{ request.form.get('name', client.name or '') }}"></label>
    <label>Empresa<input name="company" value="{{ request.form.get('company', client.company or '') }}"></label>
    <label>E-mail<input type="email" name="email" value="{{ request.form.get('email', client.email or '') }}"></label>
    <label>Telefone<input name="phone" value="{{ request.form.get('phone', client.phone or '') }}"></label>
    <label>Status
      <select name="status">{% for s in statuses %}<option {{ 'selected' if s == (request.form.get('status') or client.status or 'Lead') }}>{{ s }}</option>{% endfor %}</select>
    </label>
    <label class="full">Observações<textarea name="notes" rows="4">{{ request.form.get('notes', client.notes or '') }}</textarea></label>
  </div>
  <div class="actions"><a class="btn" href="{{ url_for('clients.index') }}">Cancelar</a><button class="btn primary" type="submit">Salvar cliente</button></div>
</form>
{% endblock %}
